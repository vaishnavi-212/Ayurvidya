<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efe3c8">
  <meta name="description" content="Study Sushruta Samhita, Nidana Sthana 1, verse by verse through the 7 Ayurvidya steps">
  <title>Ayurvidya</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Tiro+Devanagari+Sanskrit&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>try { const t = localStorage.getItem("ayv.theme"); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="masthead">
    <a class="brand" href="#/" aria-label="Ayurvidya home">
      <img src="icon.svg" alt="" width="40" height="40">
      <span class="brand-text"><span class="deva">आयुर्विद्या</span><b>Ayurvidya</b></span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#/" data-nav="home">Contents</a>
      <a href="#/verses" data-nav="verses">Verses</a>
      <a href="#/ask" data-nav="ask">Ask</a>
      <a href="#/graph" data-nav="graph" hidden>Vayu map</a>
      <a href="#/notes" data-nav="notes" hidden>My notes</a>
    </nav>
    <form class="jump" id="jump" role="search">
      <label for="jumpIn" class="sr">Go to verse number</label>
      <input id="jumpIn" type="search" placeholder="Verse no." inputmode="numeric" autocomplete="off">
    </form>
    <button class="lamp" id="theme" aria-label="Switch between day and lamp-light reading">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c2 3 3 4.6 3 6.3A3 3 0 0 1 12 12a3 3 0 0 1-3-2.7C9 7.6 10 6 12 3zM6 15h12l-1.5 3h-9zM9 21h6"/></svg>
    </button>
  </header>
  <div class="rule" aria-hidden="true"></div>

  <main id="view" class="view" tabindex="-1" aria-live="polite"></main>

  <aside class="sheet" id="sheet" aria-hidden="true">
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <button class="sheet-x" id="sheetX" aria-label="Close">×</button>
      <div id="sheetBody"></div>
    </div>
  </aside>

  <nav class="tabbar" aria-label="Main">
    <a href="#/" data-nav="home"><span class="deva">सूची</span>Contents</a>
    <a href="#/verses" data-nav="verses"><span class="deva">श्लोकाः</span>Verses</a>
    <a href="#/ask" data-nav="ask"><span class="deva">प्रश्नः</span>Ask</a>
    <a href="#/notes" data-nav="notes" hidden><span class="deva">टिप्पणी</span>Notes</a>
  </nav>
  <script src="app.js"></script>
</body>
</html>
